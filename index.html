<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Full Roast Ahead</title>
    <!-- Empty icon: stops the browser from requesting /favicon.ico. -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="src/styles.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div class="game">
      <section class="stage">
        <svg class="scene" data-ref="scene" role="img" aria-label=""></svg>
        <div class="hud">
          <div class="money" data-ref="money-pill">
            <svg class="coin" viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="16" r="15" fill="#C9901A" />
              <circle cx="16" cy="15" r="13" fill="#F2C14E" />
              <g transform="translate(16 15) rotate(-25)">
                <ellipse rx="5.5" ry="7.5" fill="#C9901A" />
                <path d="M0 -6Q-2.5 0 0 6" stroke="#F2C14E" stroke-width="1.6" fill="none" />
              </g>
            </svg>
            <span data-ref="money">0</span>
          </div>
          <div class="rate" data-ref="rate"></div>
        </div>
        <div class="settings">
          <button type="button" class="icon-button" data-action="sound" data-ref="sound">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9H8L13 5V19L8 15H4Z" fill="currentColor" />
              <path class="waves" d="M16 9Q18 12 16 15M18.5 6.5Q22 12 18.5 17.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
              <path class="cross" d="M16 9L22 15M22 9L16 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="icon-button text" data-action="language" data-ref="language">EN</button>
          <button type="button" class="icon-button" data-action="restart" data-ref="restart">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 12A6 6 0 1 0 8 7.5" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" />
              <path d="M4 4V9H9" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="fx-layer" data-ref="fx" aria-hidden="true"></div>
        <div class="banner" data-ref="banner" hidden></div>
      </section>

      <section class="controls">
        <div class="goal" data-ref="goal" aria-live="polite">
          <span class="goal-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path class="flag" d="M5 17V3M5 4H15L12.5 7.5L15 11H5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" /><path class="check" d="M4 10.5L8.5 15L16 5.5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </span>
          <span class="goal-text" data-ref="goal-text"></span>
          <span class="goal-reward" data-ref="goal-reward"></span>
        </div>
        <div class="roast">
          <div class="gauge-wrap">
            <div class="gauge-head">
              <span class="gauge-title" data-ref="pan-title"></span>
              <span class="wish" data-ref="wish"></span>
            </div>
            <div class="gauge" data-ref="gauge">
              <div class="tick first"></div>
              <div class="tick second"></div>
              <div class="target" data-ref="target"></div>
              <div class="needle" data-ref="needle"></div>
            </div>
            <div class="gauge-labels" data-ref="gauge-labels"></div>
            <div class="status" data-ref="status"></div>
          </div>
          <button type="button" class="btn stir" data-action="stir" data-ref="stir"></button>
          <button type="button" class="btn eject" data-action="eject" data-ref="eject" disabled></button>
        </div>
      </section>

      <aside class="side">
        <h2 data-ref="shop-title"></h2>
        <div class="items" data-ref="items"></div>
        <section class="stats">
          <h3 data-ref="stats-title"></h3>
          <dl>
            <dt data-ref="stats-cart-label"></dt>
            <dd data-ref="stats-cart"></dd>
            <dt data-ref="stats-guests-label"></dt>
            <dd data-ref="stats-guests"></dd>
            <dt data-ref="stats-price-label"></dt>
            <dd data-ref="stats-price"></dd>
            <dt data-ref="stats-lost-label"></dt>
            <dd data-ref="stats-lost"></dd>
          </dl>
        </section>
      </aside>

      <div class="hand" data-ref="hand" hidden aria-hidden="true">
        <svg viewBox="0 0 48 60">
          <path d="M19 58C12 58 8 53 8 46V30C8 27.5 10 26 12 26C14 26 16 27.5 16 30V12C16 9.5 18 8 20 8C22 8 24 9.5 24 12V26C24 24 26 22.5 28 22.5C30 22.5 32 24 32 26.5C32 24.5 34 23.5 36 23.5C38 23.5 40 25 40 27.5V46C40 53 35 58 29 58Z" transform="rotate(180 24 33)" fill="#FFFDF8" stroke="#2A1D17" stroke-width="3" stroke-linejoin="round" />
        </svg>
      </div>

      <dialog class="confirm" data-ref="restart-dialog" aria-labelledby="restart-title">
        <h2 id="restart-title" data-ref="restart-title"></h2>
        <p data-ref="restart-body"></p>
        <div class="confirm-actions">
          <button type="button" class="btn secondary" data-action="restart-cancel" data-ref="restart-cancel"></button>
          <button type="button" class="btn" data-action="restart-confirm" data-ref="restart-confirm"></button>
        </div>
      </dialog>
    </div>
    <noscript>This game needs JavaScript.</noscript>
  </body>
</html>
